# Builds and pushes the Medusa backend Docker image.
#
# Registry defaults to GitHub Container Registry (GHCR) using the automatic
# GITHUB_TOKEN (no extra secrets required). To publish to Docker Hub instead,
# uncomment the docker/login-action step below and set the DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN secrets (or create a .github/release.yml / image in GHCR).
#
# Tags:
#   - push to main            -> ghcr.io/<owner>/dtc-backend:main and :<sha>
#   - push tag "v*"           -> ghcr.io/<owner>/dtc-backend:<tag> and :latest
#   - pull request            -> build only (no push)

name: Build and push backend image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/dtc-backend

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # (optional) OIDC token, used for signed images

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Uncomment to also push to Docker Hub (needs DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets)
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build metadata (tags + labels). Always adds a stable tag; only tag
      # `latest`/version on main/tags, so PR preview builds don't pollute it.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' && github.ref_name != 'main' }}
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
